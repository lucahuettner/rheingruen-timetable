<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <!-- Top Center Red Rave Glow -->
    <radialGradient id="top-rave-glow" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#FF1E27" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#FF1E27" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#FF1E27" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#060608" stop-opacity="0" />
    </radialGradient>

    <!-- Chrome / Steel Beam Gradients -->
    <linearGradient id="beam-steel-left" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#94A3B8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beam-steel-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#94A3B8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Red Accent Beam Gradient -->
    <linearGradient id="beam-red" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" stop-opacity="0.30" />
      <stop offset="40%" stop-color="#FF1E27" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FF1E27" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Base Background -->
  <rect width="1440" height="1000" fill="#060608" />

  <!-- Radiating Industrial Speedline Beams (Perspective Angle) -->
  <g>
    <!-- Wide Angle Outer Beams -->
    <polygon points="720,-40 -300,120 -300,280" fill="url(#beam-steel-left)" />
    <polygon points="720,-40 -200,450 -100,680" fill="url(#beam-steel-left)" opacity="0.8" />
    <polygon points="720,-40 20,1050 160,1050" fill="url(#beam-steel-left)" opacity="0.9" />

    <polygon points="720,-40 1740,120 1740,280" fill="url(#beam-steel-right)" />
    <polygon points="720,-40 1640,450 1540,680" fill="url(#beam-steel-right)" opacity="0.8" />
    <polygon points="720,-40 1420,1050 1280,1050" fill="url(#beam-steel-right)" opacity="0.9" />

    <!-- Mid Sector Speed Beams -->
    <polygon points="720,-40 280,1050 380,1050" fill="url(#beam-steel-left)" opacity="0.7" />
    <polygon points="720,-40 460,1050 540,1050" fill="url(#beam-steel-left)" opacity="0.85" />

    <polygon points="720,-40 1160,1050 1060,1050" fill="url(#beam-steel-right)" opacity="0.7" />
    <polygon points="720,-40 980,1050 900,1050" fill="url(#beam-steel-right)" opacity="0.85" />

    <!-- Central Red High-Energy Beams -->
    <polygon points="720,-40 640,1050 670,1050" fill="url(#beam-red)" />
    <polygon points="720,-40 770,1050 800,1050" fill="url(#beam-red)" />
    <polygon points="720,-40 705,1050 735,1050" fill="url(#beam-red)" opacity="0.6" />
  </g>

  <!-- Sharp Industrial Speedlines (Strokes) -->
  <g stroke-linecap="round">
    <!-- Far Left -->
    <line x1="720" y1="-40" x2="-250" y2="200" stroke="rgba(255, 255, 255, 0.18)" stroke-width="2" />
    <line x1="720" y1="-40" x2="-200" y2="380" stroke="rgba(255, 30, 39, 0.35)" stroke-width="2.5" />
    <line x1="720" y1="-40" x2="-150" y2="560" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <line x1="720" y1="-40" x2="-80" y2="760" stroke="rgba(255, 255, 255, 0.22)" stroke-width="3" />
    <line x1="720" y1="-40" x2="80" y2="1050" stroke="rgba(255, 30, 39, 0.30)" stroke-width="2" />
    <line x1="720" y1="-40" x2="220" y2="1050" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.5" />
    <line x1="720" y1="-40" x2="330" y2="1050" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <line x1="720" y1="-40" x2="420" y2="1050" stroke="rgba(255, 30, 39, 0.40)" stroke-width="2.5" />
    <line x1="720" y1="-40" x2="500" y2="1050" stroke="rgba(255, 255, 255, 0.20)" stroke-width="2" />
    <line x1="720" y1="-40" x2="590" y2="1050" stroke="rgba(255, 255, 255, 0.30)" stroke-width="3" />
    <line x1="720" y1="-40" x2="655" y2="1050" stroke="rgba(255, 30, 39, 0.50)" stroke-width="2.5" />

    <!-- Center Line -->
    <line x1="720" y1="-40" x2="720" y2="1050" stroke="rgba(255, 30, 39, 0.60)" stroke-width="3" />

    <!-- Far Right -->
    <line x1="720" y1="-40" x2="785" y2="1050" stroke="rgba(255, 30, 39, 0.50)" stroke-width="2.5" />
    <line x1="720" y1="-40" x2="850" y2="1050" stroke="rgba(255, 255, 255, 0.30)" stroke-width="3" />
    <line x1="720" y1="-40" x2="940" y2="1050" stroke="rgba(255, 255, 255, 0.20)" stroke-width="2" />
    <line x1="720" y1="-40" x2="1020" y2="1050" stroke="rgba(255, 30, 39, 0.40)" stroke-width="2.5" />
    <line x1="720" y1="-40" x2="1110" y2="1050" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <line x1="720" y1="-40" x2="1220" y2="1050" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.5" />
    <line x1="720" y1="-40" x2="1360" y2="1050" stroke="rgba(255, 30, 39, 0.30)" stroke-width="2" />
    <line x1="720" y1="-40" x2="1520" y2="760" stroke="rgba(255, 255, 255, 0.22)" stroke-width="3" />
    <line x1="720" y1="-40" x2="1590" y2="560" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <line x1="720" y1="-40" x2="1640" y2="380" stroke="rgba(255, 30, 39, 0.35)" stroke-width="2.5" />
    <line x1="720" y1="-40" x2="1690" y2="200" stroke="rgba(255, 255, 255, 0.18)" stroke-width="2" />
  </g>

  <!-- Top Center Focal Rave Red Glow Overlay -->
  <rect width="1440" height="1000" fill="url(#top-rave-glow)" />

  <!-- Subtle Perspective Floor Horizon Grid -->
  <line x1="0" y1="200" x2="1440" y2="200" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
  <line x1="0" y1="400" x2="1440" y2="400" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
  <line x1="0" y1="650" x2="1440" y2="650" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  <line x1="0" y1="850" x2="1440" y2="850" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
</svg>
