<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e0c" />
      <stop offset="50%" stop-color="#040807" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60EFFF" />
      <stop offset="40%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#neonGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Background Soundwave Pattern Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00FF87" stroke-width="1.5" stroke-opacity="0.1" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="#60EFFF" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="4 8" />

  <!-- Center Graphic: Modern Festival Stylized 'R' with Soundwave River Curves -->
  <g filter="url(#glow)">
    <!-- Vertical stem -->
    <path d="M 160 130 L 160 382" stroke="url(#neonGrad)" stroke-width="32" stroke-linecap="round" />
    <!-- Loop of R -->
    <path d="M 160 146 C 240 146 320 160 320 236 C 320 300 248 316 160 316" fill="none" stroke="url(#neonGrad)" stroke-width="32" stroke-linecap="round" />
    <!-- Leg of R flowing into river wave -->
    <path d="M 230 306 L 316 382" stroke="url(#neonGrad)" stroke-width="32" stroke-linecap="round" />
  </g>

  <!-- Frequency equalizer bars at bottom right -->
  <g filter="url(#softGlow)">
    <rect x="340" y="320" width="10" height="62" rx="5" fill="#00FF87" />
    <rect x="362" y="290" width="10" height="92" rx="5" fill="#60EFFF" />
    <rect x="384" y="336" width="10" height="46" rx="5" fill="#00FF87" opacity="0.8" />
    <rect x="406" y="352" width="10" height="30" rx="5" fill="#10B981" opacity="0.6" />
  </g>

  <!-- Pulse Dot (Live Indicator) -->
  <circle cx="360" cy="140" r="12" fill="#00FF87" filter="url(#softGlow)" />
  <circle cx="360" cy="140" r="22" fill="none" stroke="#00FF87" stroke-width="2" opacity="0.5" />
</svg>
