<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FF1E27" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#FF1E27" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#060608" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="red-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E27" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#FF1E27" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF1E27" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="512" height="512" rx="112" fill="#0A0B0E" />
  <!-- Radial Atmosphere -->
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)" />

  <!-- Cyber Octagon Outer Frame -->
  <polygon points="140,48 372,48 464,140 464,372 372,464 140,464 48,372 48,140"
           fill="none" stroke="#FF1E27" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Corner Tech Accent Chants -->
  <line x1="48" y1="140" x2="140" y2="48" stroke="#FF1E27" stroke-width="6" stroke-linecap="round" />
  <line x1="372" y1="48" x2="464" y2="140" stroke="#FF1E27" stroke-width="6" stroke-linecap="round" />
  <line x1="464" y1="372" x2="372" y2="464" stroke="#FF1E27" stroke-width="6" stroke-linecap="round" />
  <line x1="140" y1="464" x2="48" y2="372" stroke="#FF1E27" stroke-width="6" stroke-linecap="round" />

  <!-- Inner Tech Plate -->
  <polygon points="152,70 360,70 442,152 442,360 360,442 152,442 70,360 70,152"
           fill="#07080B" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1.5" />

  <!-- HIVE Main Letters (Vector Geometric Cut) -->
  <g fill="url(#metal-grad)">
    <!-- H -->
    <path d="M 80,160 L 108,160 L 108,212 L 132,212 L 132,160 L 160,160 L 160,285 L 132,285 L 132,238 L 108,238 L 108,285 L 80,285 Z" />
    
    <!-- I -->
    <rect x="180" y="160" width="28" height="125" />

    <!-- V -->
    <polygon points="228,160 258,160 273,248 288,160 318,160 287,285 259,285" />

    <!-- E -->
    <path d="M 338,160 L 416,160 L 416,187 L 366,187 L 366,209 L 406,209 L 406,235 L 366,235 L 366,258 L 416,258 L 416,285 L 338,285 Z" />
  </g>

  <!-- Red Accent Divider Line -->
  <line x1="80" y1="305" x2="416" y2="305" stroke="url(#red-neon)" stroke-width="2.5" />

  <!-- INDOOR Badge Box -->
  <rect x="156" y="328" width="200" height="42" rx="6" fill="#1C0507" stroke="#FF1E27" stroke-width="2" />

  <!-- INDOOR Pure Vector Glyphs (Height 18px: y 340 to 358) -->
  <g fill="#FFFFFF">
    <!-- I -->
    <rect x="189" y="340" width="4" height="18" />

    <!-- N -->
    <path d="M 203,358 L 203,340 L 206.5,340 L 215.5,353.5 L 215.5,340 L 219,340 L 219,358 L 215.5,358 L 206.5,344.5 L 206.5,358 Z" />

    <!-- D -->
    <path d="M 229,340 L 238,340 C 243,340 246,343 246,349 C 246,355 243,358 238,358 L 229,358 Z M 232.5,343.5 L 232.5,354.5 L 237.5,354.5 C 240.5,354.5 242.5,352.5 242.5,349 C 242.5,345.5 240.5,343.5 237.5,343.5 Z" />

    <!-- O (1) -->
    <path d="M 263,340 C 267.8,340 271,343.8 271,349 C 271,354.2 267.8,358 263,358 C 258.2,358 255,354.2 255,349 C 255,343.8 258.2,340 263,340 Z M 263,343.5 C 260.5,343.5 258.5,346 258.5,349 C 258.5,352 260.5,354.5 263,354.5 C 265.5,354.5 267.5,352 267.5,349 C 267.5,346 265.5,343.5 263,343.5 Z" />

    <!-- O (2) -->
    <path d="M 289,340 C 293.8,340 297,343.8 297,349 C 297,354.2 293.8,358 289,358 C 284.2,358 281,354.2 281,349 C 281,343.8 284.2,340 289,340 Z M 289,343.5 C 286.5,343.5 284.5,346 284.5,349 C 284.5,352 286.5,354.5 289,354.5 C 291.5,354.5 293.5,352 293.5,349 C 293.5,346 291.5,343.5 289,343.5 Z" />

    <!-- R -->
    <path d="M 307,340 L 316,340 C 319.5,340 321.5,341.8 321.5,345 C 321.5,347.8 319.8,349.2 317,349.7 L 322,358 L 318,358 L 313.5,350.5 L 310.5,350.5 L 310.5,358 L 307,358 Z M 310.5,343.5 L 310.5,347.5 L 315,347.5 C 316.8,347.5 318,346.5 318,345 C 318,343.5 316.8,343.5 315,343.5 Z" />
  </g>

  <!-- Tech Status Dots & Cyber Grid Line -->
  <line x1="170" y1="404" x2="342" y2="404" stroke="#FF1E27" stroke-width="1.5" stroke-opacity="0.35" />
  <circle cx="256" cy="404" r="3.5" fill="#FF1E27" />
  <circle cx="236" cy="404" r="2" fill="#E2E8F0" opacity="0.6" />
  <circle cx="276" cy="404" r="2" fill="#E2E8F0" opacity="0.6" />
  <circle cx="216" cy="404" r="1.5" fill="#E2E8F0" opacity="0.3" />
  <circle cx="296" cy="404" r="1.5" fill="#E2E8F0" opacity="0.3" />
</svg>
